amcl:
  ros__parameters:
    use_sim_time: true

    # Frame configuration
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link

    # Sensor input
    scan_topic: /scan
    laser_model_type: likelihood_field
    laser_min_range: -1.0
    laser_max_range: 8.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60

    # Differential-drive motion model
    robot_model_type: nav2_amcl::DifferentialMotionModel

    # Odometry noise model
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Particle filter sizing
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # Sensor model weights
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1

    # Beam skipping
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    # Update thresholds
    # Publish fresh localization evidence while the simulated robot is idle.
    update_min_d: 0.0
    update_min_a: 0.0

    # Recovery behavior
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # TF and pose publication
    tf_broadcast: true
    transform_tolerance: 0.0
    save_pose_rate: 0.5

    # Initial pose near the simulated spawn position
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
